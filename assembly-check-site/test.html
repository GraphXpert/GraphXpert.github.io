<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assembly Check Web - Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
    </style>
</head>
<body>
    <h1>Assembly Check Web - Test Page</h1>
    
    <div class="test-section info">
        <h2>Test Environment Check</h2>
        <div id="browser-info"></div>
    </div>
    
    <div class="test-section">
        <h2>External Dependencies</h2>
        <div id="dependency-check"></div>
    </div>
    
    <div class="test-section">
        <h2>File API Support</h2>
        <div id="file-api-check"></div>
    </div>
    
    <div class="test-section">
        <h2>Application Test</h2>
        <button onclick="testApplication()">Run Application Test</button>
        <div id="app-test-results"></div>
    </div>

    <div class="test-section">
        <h2>Anteprima Report</h2>
        <button id="preview-btn">Genera anteprima report di esempio</button>
        <button id="download-btn">Scarica PDF di esempio</button>
        <div id="report-preview" style="margin-top:10px;"></div>
    </div>
    
    <div class="test-section">
        <h2>Links</h2>
        <p><a href="index.html">Go to Main Application</a></p>
        <p><a href="#" onclick="window.history.back()">Go Back</a></p>
    </div>

    <script>
        // Browser information
        document.getElementById('browser-info').innerHTML = `
            <p><strong>User Agent:</strong> ${navigator.userAgent}</p>
            <p><strong>Platform:</strong> ${navigator.platform}</p>
            <p><strong>Language:</strong> ${navigator.language}</p>
        `;

        // Dependency check
        const dependencyResults = [];
        
        // Check for PDF.js
        if (typeof window['pdfjs-dist/build/pdf'] !== 'undefined') {
            dependencyResults.push('<div class="success">✓ PDF.js is available</div>');
        } else {
            dependencyResults.push('<div class="error">✗ PDF.js is not available - will be loaded from CDN</div>');
        }
        
        // Check for SheetJS
        if (typeof XLSX !== 'undefined') {
            dependencyResults.push('<div class="success">✓ SheetJS (XLSX) is available</div>');
        } else {
            dependencyResults.push('<div class="error">✗ SheetJS is not available - will be loaded from CDN</div>');
        }
        
        document.getElementById('dependency-check').innerHTML = dependencyResults.join('');

        // File API check
        const fileApiResults = [];
        if (window.File && window.FileReader && window.FileList && window.Blob) {
            fileApiResults.push('<div class="success">✓ File API is supported</div>');
        } else {
            fileApiResults.push('<div class="error">✗ File API is not supported</div>');
        }
        
        if (window.DragEvent) {
            fileApiResults.push('<div class="success">✓ Drag and Drop is supported</div>');
        } else {
            fileApiResults.push('<div class="error">✗ Drag and Drop is not supported</div>');
        }
        
        document.getElementById('file-api-check').innerHTML = fileApiResults.join('');

        // Application test
        function testApplication() {
            const resultsDiv = document.getElementById('app-test-results');
            resultsDiv.innerHTML = '<p>Testing application components...</p>';
            
            try {
                // Test code extraction pattern
                const testText = "Some codes like ABC123, DEF456, and GHI789 should be found. Numbers like 12345 or just ABC should be ignored.";
                const pattern = /\b[A-Z0-9]{2,}\b/g;
                const matches = testText.match(pattern) || [];
                
                const filteredMatches = matches.filter(code => {
                    if (/^\d+$/.test(code) || /^[A-Z]+$/.test(code)) return false;
                    if (code.length < 3) return false;
                    return true;
                });
                
                resultsDiv.innerHTML = `
                    <div class="success">
                        <h3>Code Extraction Test Results:</h3>
                        <p><strong>Original matches:</strong> ${matches.join(', ')}</p>
                        <p><strong>Filtered matches:</strong> ${filteredMatches.join(', ')}</p>
                        <p><strong>Pattern working:</strong> ${filteredMatches.length > 0 ? 'Yes' : 'No'}</p>
                    </div>
                `;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Application test failed: ${error.message}</div>`;
            }
        }

        const previewBtn = document.getElementById('preview-btn');
        const downloadBtn = document.getElementById('download-btn');
        const previewHost = document.getElementById('report-preview');
        let previewElem = null;
        previewBtn.addEventListener('click', async () => {
            const app = new (window.AssemblyCheckApp || (await importApp()))();
            app.excelData = [
                { row: 19, code: 'ABC123', qty: 3 },
                { row: 20, code: 'DEF456', qty: 2 },
                { row: 21, code: 'GHI789', qty: 1 }
            ];
            const pdfFreq = { ABC123: 3, DEF456: 1 };
            const excelFreq = { ABC123: 3, DEF456: 2, GHI789: 1 };
            app.results = {
                totalPdfCodes: 4,
                totalExcelCodes: 6,
                totalPdfUnique: Object.keys(pdfFreq).length,
                totalExcelUnique: Object.keys(excelFreq).length,
                excelRowsProcessed: app.excelData.length,
                pdfFilesProcessed: 2,
                matches: ['ABC123','DEF456'],
                pdfOnly: [],
                excelOnly: ['GHI789'],
                quantityCorrect: [{ code:'ABC123', pdf:3, excel:3 }],
                quantityMissing: [{ code:'DEF456', pdf:1, excel:2, missing:1 }],
                quantityExtra: [],
                pdfFreq,
                excelFreq
            };
            previewElem = app.buildPdfElement();
            previewHost.innerHTML = '';
            previewHost.appendChild(previewElem);
        });

        downloadBtn.addEventListener('click', async () => {
            if (!previewElem) return;
            if (!window.html2pdf) {
                const s = document.createElement('script');
                s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
                await new Promise(r => { s.onload = r; document.body.appendChild(s); });
            }
            const opt = {
                margin: { top: 8, right: 14, bottom: 8, left: 8 },
                filename: 'assembly-check-sample.pdf',
                image: { type: 'jpeg', quality: 0.95 },
                html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollY: 0 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['css','legacy'], avoid: ['tr'] }
            };
            window.html2pdf().set(opt).from(previewElem).save();
        });

        async function importApp() {
            await new Promise(r => {
                const s = document.createElement('script');
                s.src = 'app.js';
                s.onload = r;
                document.body.appendChild(s);
            });
            return window.AssemblyCheckApp || window['AssemblyCheckApp'];
        }
    </script>
</body>
</html>
